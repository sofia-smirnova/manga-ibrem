<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ибрем — Бесконечный IQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <main class="container">
        <div class="badge">⚡ ЛЕГЕНДА ⚡</div>
        <h1>Жил-был один Ибрем...</h1>
        <div class="story">
            <p>Жил был один <span>Ибрем</span> и резко упал со ступенек...</p>
            <p class="power">И стало у него <strong>∞ × ∞<sup>∞</sup></strong> IQ</p>
            <p>Во всех возможных вещах мира.</p>
            <div class="divider">✦ ✦ ✦</div>
            <p class="epic">Ибрем раком ставит Физарина и Омнираз, причём Омнираз сильнее Физарина <span>во всех вещах вообще.</span></p>
            <div class="impossible">НЕВОЗМОЖНО ПРОИГРАТЬ КОМУ-ТО</div>
        </div>
        <button id="powerButton">⚡ АКТИВИРОВАТЬ ИБРЕМА ⚡</button>
        <div id="result"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
